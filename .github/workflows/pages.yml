name: Publish project website

on:
  push:
    branches: [main]
    paths: [site/**, tools/build-site.cjs, tools/verify-site.cjs, tools/indexnow.json, tools/submit-indexnow.ps1, .github/workflows/pages.yml]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build with the published download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHED="$(gh release view picog2-1.6.2-20261113 --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '(.isDraft == false) and any(.assets[]; .name == "Wolvic-1.6.2-picog2-20261113-arm64-signed.apk")' 2>/dev/null || true)"
          if [ "$PUBLISHED" = "true" ]; then
            node tools/build-site.cjs --published-candidate
          else
            node tools/build-site.cjs
          fi
      - run: node tools/verify-site.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  notify-search:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether showcase content changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$BASE_REVISION" = "0000000000000000000000000000000000000000" ] || ! git diff --quiet "$BASE_REVISION" HEAD -- site/index.html site/en/index.html site/assets tools/indexnow.json; then
            echo "notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow of the two showcase pages
        if: steps.changes.outputs.notify == 'true'
        id: indexnow
        continue-on-error: true
        shell: pwsh
        run: ./tools/submit-indexnow.ps1
      - name: Record notification outcome
        if: always()
        env:
          NOTIFICATION_OUTCOME: ${{ steps.indexnow.outcome }}
        run: |
          echo "IndexNow notification: $NOTIFICATION_OUTCOME. See the notification step for the HTTP response. Receipt is not proof of indexing." >> "$GITHUB_STEP_SUMMARY"
